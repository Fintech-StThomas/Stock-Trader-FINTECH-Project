name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # the package's own dependency lists (pyproject.toml), so the tests run on what an install gets;
      # tests/test_packaging.py keeps requirements.txt (read by Streamlit Cloud and the devcontainer) in step
      - run: pip install -e ".[app,dev]"
      - run: python -m pytest -q
        env:
          LIGHTHOUSE_OFFLINE: "1"
