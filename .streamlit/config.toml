# Streamlit theme and server settings for the Lighthouse app.
# Colours match lighthouse/charts.py so the UI and the charts read as one system.

[theme]
base = "light"
primaryColor = "#2a78d6"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f1f0ec"
textColor = "#0b0b0b"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = true
# When the app's files change under a running server (a merge pulled by Streamlit Community Cloud), every open
# page reruns by itself instead of waiting for a click or a reboot. app.py then loads the new code (see its top).
runOnSave = true
