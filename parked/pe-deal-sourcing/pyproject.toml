# PE Deal Sourcing (parked). Its own project: run everything from this folder.
[project]
name = "pedeals"
version = "1.0.0"
requires-python = ">=3.9"

[project.scripts]
pedeals = "pedeals.__main__:main"

[tool.setuptools.packages.find]
include = ["pedeals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
