[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lighthouse-invest"
version = "1.2.0"
description = "Lighthouse - an explainable stock decision engine for self-directed investors"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pandas>=2.0", "numpy>=1.24", "scipy>=1.10", "plotly>=5.18", "yfinance>=0.2.40", "requests>=2.28", "pyarrow>=14", "lxml>=4.9", "beautifulsoup4>=4.12"]

[project.optional-dependencies]
app = ["streamlit>=1.49"]
dev = ["pytest>=7.0", "scikit-learn", "nbformat", "nbconvert", "ipykernel"]

[project.scripts]
lighthouse = "lighthouse.__main__:main"
pedeals = "pedeals.__main__:main"

[tool.setuptools.packages.find]
include = ["lighthouse*", "pedeals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
